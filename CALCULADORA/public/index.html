<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="public/css/style.css">
    <title>Calculadora de Descuentos con Estructuras Condicionales</title>
</head>
<body>
    <!-- Header -->
    <header class="justify-content-center shadow-sm mb-3">
        <div class="row">
            <div class="my-3 col-sm-12 col-md-3">
            </div>
            <div class="py-4 text-center col-md-9">
                <h1>Grupo 6 - Actividad 3</h1>
                <p class="lead">Aplicación de Tecnologías Web</p>
            </div>
        </div>
    </header>


    <main class="container">
        <section class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Calculadora de Descuentos con Estructuras Condicionales</h4>
                    </div>
                    <div class="card-body">
                        <form id="discountForm" novalidate>
                            <div class="mb-3">
                                <label for="productName" class="form-label">Nombre del producto</label>
                                <input type="text" class="form-control" id="productName" name="productName" required placeholder="Ej. Laptop">
                                <div class="invalid-feedback">Ingresa el nombre del producto.</div>
                            </div>
                            <div class="mb-3">
                                <label for="productPrice" class="form-label">Precio del producto</label>
                                <input type="number" class="form-control" id="productPrice" name="productPrice" min="0" step="0.01" required placeholder="Ej. 499.99">
                                <div class="invalid-feedback">Ingresa un precio válido mayor o igual a 0.</div>
                            </div>
                            <div class="mb-3">
                                <label for="clientType" class="form-label">Tipo de cliente</label>
                                <select class="form-select" id="clientType" name="clientType" required>
                                    <option value="" selected disabled>Selecciona una opción</option>
                                    <option value="estudiante">Estudiante</option>
                                    <option value="adulto">Adulto</option>
                                    <option value="jubilado">Jubilado</option>
                                </select>
                                <div class="invalid-feedback">Selecciona el tipo de cliente.</div>
                            </div>
                            <div class="mb-3">
                                <label for="paymentMethod" class="form-label">Forma de pago</label>
                                <select class="form-select" id="paymentMethod" name="paymentMethod" required>
                                    <option value="" selected disabled>Selecciona una opción</option>
                                    <option value="efectivo">Efectivo</option>
                                    <option value="tarjeta">Tarjeta</option>
                                    <option value="transferencia">Transferencia</option>
                                </select>
                                <div class="invalid-feedback">Selecciona la forma de pago.</div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Calcular descuento</button>
                            </div>
                        </form>
                        <div id="result" class="alert alert-info mt-4 d-none" role="alert"></div>
                    </div>
                </div>
            </div>
        </section>

      <section class="row justify-content-center mt-4">
            <div class="col-lg-8 bg-primary shadow-sm rounded text-white">
                <div class="p-3">
                    <h3>Integrantes:</h3>
                    <ul>
                        <li>1. </li>
                        <li>2. </li>
                        <li>3. </li>
                        <li>4. </li>
                        <li>5. </li>
                    </ul>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="public/js/script.js"></script>
</body>
</html>
